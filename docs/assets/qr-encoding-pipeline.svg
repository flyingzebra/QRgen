<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="168" viewBox="0 0 1280 168" role="img" aria-labelledby="title desc"><title id="title">QR encoder workflow</title><desc id="desc">Eight stages for producing a Model 2 QR code</desc><rect width="1280" height="168" fill="#ffffff"/><text x="22" y="32" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#0f172a" font-weight="700">Classic QR Code Model 2: end-to-end construction</text><rect x="19" y="58" width="143" height="81" rx="9" fill="#ede9fe" stroke="#a8a29e" stroke-width="0.65"/><text x="28" y="90" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#0f172a" font-weight="700">Analyze</text><text x="28" y="114" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#334155" font-weight="400">segment + ECC</text><path d="M163 101 h14 m-6 -5 l6 5 l-6 5" stroke="#475569" stroke-width="2" fill="none"/><rect x="178" y="58" width="143" height="81" rx="9" fill="#dbeafe" stroke="#a8a29e" stroke-width="0.65"/><text x="187" y="90" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#0f172a" font-weight="700">Encode</text><text x="187" y="114" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#334155" font-weight="400">mode and bits</text><path d="M322 101 h14 m-6 -5 l6 5 l-6 5" stroke="#475569" stroke-width="2" fill="none"/><rect x="337" y="58" width="143" height="81" rx="9" fill="#ede9fe" stroke="#a8a29e" stroke-width="0.65"/><text x="346" y="90" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#0f172a" font-weight="700">Pad</text><text x="346" y="114" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#334155" font-weight="400">0xEC / 0x11</text><path d="M481 101 h14 m-6 -5 l6 5 l-6 5" stroke="#475569" stroke-width="2" fill="none"/><rect x="496" y="58" width="143" height="81" rx="9" fill="#dbeafe" stroke="#a8a29e" stroke-width="0.65"/><text x="505" y="90" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#0f172a" font-weight="700">RS parity</text><text x="505" y="114" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#334155" font-weight="400">per block</text><path d="M640 101 h14 m-6 -5 l6 5 l-6 5" stroke="#475569" stroke-width="2" fill="none"/><rect x="655" y="58" width="143" height="81" rx="9" fill="#ede9fe" stroke="#a8a29e" stroke-width="0.65"/><text x="664" y="90" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#0f172a" font-weight="700">Interleave</text><text x="664" y="114" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#334155" font-weight="400">data then ECC</text><path d="M799 101 h14 m-6 -5 l6 5 l-6 5" stroke="#475569" stroke-width="2" fill="none"/><rect x="814" y="58" width="143" height="81" rx="9" fill="#dbeafe" stroke="#a8a29e" stroke-width="0.65"/><text x="823" y="90" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#0f172a" font-weight="700">Matrix</text><text x="823" y="114" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#334155" font-weight="400">reserve + place</text><path d="M958 101 h14 m-6 -5 l6 5 l-6 5" stroke="#475569" stroke-width="2" fill="none"/><rect x="973" y="58" width="143" height="81" rx="9" fill="#ede9fe" stroke="#a8a29e" stroke-width="0.65"/><text x="982" y="90" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#0f172a" font-weight="700">Mask</text><text x="982" y="114" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#334155" font-weight="400">score all eight</text><path d="M1117 101 h14 m-6 -5 l6 5 l-6 5" stroke="#475569" stroke-width="2" fill="none"/><rect x="1132" y="58" width="143" height="81" rx="9" fill="#dbeafe" stroke="#a8a29e" stroke-width="0.65"/><text x="1141" y="90" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#0f172a" font-weight="700">Metadata</text><text x="1141" y="114" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#334155" font-weight="400">BCH + output</text><text x="153" y="130" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#475569" font-weight="700">L1</text><text x="312" y="130" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#475569" font-weight="700">L1–2</text><text x="471" y="130" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#475569" font-weight="700">L2</text><text x="630" y="130" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#475569" font-weight="700">L3</text><text x="789" y="130" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#475569" font-weight="700">L3</text><text x="948" y="130" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#475569" font-weight="700">L4–5</text><text x="1107" y="130" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#475569" font-weight="700">L6</text><text x="1266" y="130" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#475569" font-weight="700">L7–8</text></svg>