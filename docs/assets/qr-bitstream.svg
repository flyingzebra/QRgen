<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="181" viewBox="0 0 1060 181" role="img" aria-labelledby="title desc"><title id="title">QR bitstream schematic</title><desc id="desc">Mode indicator, count, payload, terminator, byte alignment and alternating pad bytes</desc><rect width="1060" height="181" fill="#ffffff"/><text x="25" y="31" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#0f172a" font-weight="700">Data-codeword bitstream (before parity)</text><rect x="23" y="61" width="103" height="73" rx="6" fill="#dbeafe" stroke="#cbd5e1" stroke-width="0.65"/><text x="32" y="87" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0f172a" font-weight="700">Mode</text><text x="32" y="109" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334155" font-weight="400">4 bits</text><rect x="134" y="61" width="155" height="73" rx="6" fill="#dbeafe" stroke="#cbd5e1" stroke-width="0.65"/><text x="143" y="87" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0f172a" font-weight="700">Count</text><text x="143" y="109" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334155" font-weight="400">8–16 bits</text><rect x="297" y="61" width="203" height="73" rx="6" fill="#bbf7d0" stroke="#cbd5e1" stroke-width="0.65"/><text x="306" y="87" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0f172a" font-weight="700">Payload</text><text x="306" y="109" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334155" font-weight="400">mode dependent</text><rect x="508" y="61" width="161" height="73" rx="6" fill="#fde68a" stroke="#cbd5e1" stroke-width="0.65"/><text x="517" y="87" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0f172a" font-weight="700">Terminator</text><text x="517" y="109" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334155" font-weight="400">up to 4 bits</text><rect x="677" y="61" width="171" height="73" rx="6" fill="#fde68a" stroke="#cbd5e1" stroke-width="0.65"/><text x="686" y="87" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0f172a" font-weight="700">Byte align</text><text x="686" y="109" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334155" font-weight="400">0–7 zero bits</text><rect x="856" y="61" width="190" height="73" rx="6" fill="#fecdd3" stroke="#cbd5e1" stroke-width="0.65"/><text x="865" y="87" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0f172a" font-weight="700">Pad bytes</text><text x="865" y="109" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334155" font-weight="400">EC 11 EC 11 ...</text><text x="25" y="160" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#475569" font-weight="400">Stop padding exactly at the data-codeword capacity. Reed–Solomon ECC comes afterward.</text></svg>