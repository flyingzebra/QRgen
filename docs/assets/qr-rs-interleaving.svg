<svg xmlns="http://www.w3.org/2000/svg" width="1065" height="332" viewBox="0 0 1065 332" role="img" aria-labelledby="title desc"><title id="title">Reed Solomon block interleaving</title><desc id="desc">Version 5-Q has 15,15,16,16 data bytes with 18 parity bytes per block</desc><rect width="1065" height="332" fill="#ffffff"/><text x="26" y="31" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#0f172a" font-weight="700">Version 5-Q — Reed–Solomon blocks and interleaving</text><rect x="24" y="58" width="120" height="41" rx="5" fill="#dbeafe" stroke="#38bdf8" stroke-width="0.65"/><text x="39" y="84" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0f172a" font-weight="700">Block 1: 15</text><text x="152" y="85" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#334155" font-weight="700">+</text><rect x="180" y="58" width="146" height="41" rx="5" fill="#fecdd3" stroke="#f43f5e" stroke-width="0.65"/><text x="193" y="84" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#0f172a" font-weight="400">18 parity bytes</text><rect x="24" y="109" width="120" height="41" rx="5" fill="#dbeafe" stroke="#38bdf8" stroke-width="0.65"/><text x="39" y="135" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0f172a" font-weight="700">Block 2: 15</text><text x="152" y="136" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#334155" font-weight="700">+</text><rect x="180" y="109" width="146" height="41" rx="5" fill="#fecdd3" stroke="#f43f5e" stroke-width="0.65"/><text x="193" y="135" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#0f172a" font-weight="400">18 parity bytes</text><rect x="24" y="160" width="120" height="41" rx="5" fill="#dbeafe" stroke="#38bdf8" stroke-width="0.65"/><text x="39" y="186" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0f172a" font-weight="700">Block 3: 16</text><text x="152" y="187" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#334155" font-weight="700">+</text><rect x="180" y="160" width="146" height="41" rx="5" fill="#fecdd3" stroke="#f43f5e" stroke-width="0.65"/><text x="193" y="186" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#0f172a" font-weight="400">18 parity bytes</text><rect x="24" y="211" width="120" height="41" rx="5" fill="#dbeafe" stroke="#38bdf8" stroke-width="0.65"/><text x="39" y="237" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0f172a" font-weight="700">Block 4: 16</text><text x="152" y="238" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#334155" font-weight="700">+</text><rect x="180" y="211" width="146" height="41" rx="5" fill="#fecdd3" stroke="#f43f5e" stroke-width="0.65"/><text x="193" y="237" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#0f172a" font-weight="400">18 parity bytes</text><text x="363" y="77" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#0f172a" font-weight="700">Final codeword stream</text><text x="363" y="111" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#0f172a" font-weight="400">1. Data[0] from blocks 1, 2, 3, 4</text><text x="363" y="144" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#0f172a" font-weight="400">2. Data[1] from blocks 1, 2, 3, 4</text><text x="363" y="177" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#0f172a" font-weight="400">3. Continue; only blocks 3 and 4 have Data[15]</text><text x="363" y="210" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#0f172a" font-weight="400">4. ECC[0] from blocks 1, 2, 3, 4</text><text x="363" y="243" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#0f172a" font-weight="400">5. Repeat through ECC[17] from all 4 blocks</text><text x="363" y="276" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#0f172a" font-weight="400">6. Finally add version 5 remainder: seven 0 bits</text><text x="25" y="315" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#475569" font-weight="400">Never generate ECC across interleaved bytes: create parity independently in each RS block.</text></svg>